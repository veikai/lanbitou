{% extends "base.html" %}

{% block title %}添加任务 - Lanbitou{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/add_task.css') }}">
{% endblock %}

{% block content %}
<div class="container">
    <h2>添加新任务</h2>

    <form id="addTaskForm">
        <div class="form-group">
            <label for="title">标题 *</label>
            <input type="text" id="title" name="title" required maxlength="255" placeholder="输入任务标题">
            <div class="hint">必填，1-255个字符</div>
        </div>

        <div class="form-group">
            <label for="description">描述</label>
            <textarea id="description" name="description" rows="6" maxlength="2000" placeholder="输入任务详细描述"></textarea>
            <div class="hint">可选，最多2000个字符</div>
        </div>

        <div class="form-group">
            <label for="deadline">截止日期</label>
            <input type="datetime-local" id="deadline" name="deadline">
            <div class="hint">设置任务截止日期和时间</div>
        </div>

        <div class="form-group">
            <label for="priority">优先级</label>
            <select id="priority" name="priority">
                <option value="1">1 (最低优先级)</option>
                <option value="2">2</option>
                <option value="3" selected>3 (中等优先级)</option>
                <option value="4">4</option>
                <option value="5">5 (最高优先级)</option>
            </select>
            <div class="hint">1-5，5为最高优先级</div>
        </div>

        <div class="form-actions">
            <button type="submit">创建任务</button>
            <button type="button" id="cancelBtn">取消</button>
        </div>
    </form>

    <div id="successMessage" class="hidden">
        <h3>任务创建成功！</h3>
        <p>任务已成功添加到系统。</p>
        <div class="success-actions">
            <button onclick="window.location.href='/'">查看坐标图</button>
            <button onclick="window.location.href='/tasks'">查看任务列表</button>
            <button onclick="resetForm()">创建另一个任务</button>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/add_task.js') }}"></script>
{% endblock %}
