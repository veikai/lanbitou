{% extends "base.html" %}

{% block title %}任务坐标图 - Lanbitou{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/coordinate.css') }}">
{% endblock %}

{% block content %}
<div class="container">
    <h2>任务紧急程度-重要程度坐标图</h2>

    <div class="coordinate-container">
        <div class="y-axis-label">重要程度（优先级）</div>
        <div class="chart-area">
            <div class="grid-container">
                <canvas id="coordinateCanvas" width="800" height="550"></canvas>
            </div>
            <div class="x-axis-label">紧急程度（天数）</div>
        </div>
    </div>

    <div class="task-details">
        <h3>任务详情</h3>
        <div id="taskDetails">点击任务点查看详情</div>
    </div>

    <div class="controls">
        <button id="refreshBtn">刷新数据</button>
        <label for="showDeadline">显示截止日期：</label>
        <input type="checkbox" id="showDeadline" checked>
        <label for="showTitle">显示任务标题：</label>
        <input type="checkbox" id="showTitle" checked>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/coordinate.js') }}"></script>
{% endblock %}
