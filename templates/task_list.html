{% extends "base.html" %}

{% block title %}任务列表 - Lanbitou{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/task_list.css') }}">
{% endblock %}

{% block content %}
<div class="container">
    <h2>任务列表</h2>

    <div class="controls">
        <button id="createTaskBtn">创建新任务</button>
        <input type="text" id="searchInput" placeholder="搜索任务...">
        <select id="priorityFilter">
            <option value="">所有优先级</option>
            <option value="1">优先级 1 (最低)</option>
            <option value="2">优先级 2</option>
            <option value="3">优先级 3</option>
            <option value="4">优先级 4</option>
            <option value="5">优先级 5 (最高)</option>
        </select>
    </div>

    <div class="tasks-container">
        <table id="tasksTable">
            <thead>
                <tr>
                    <th>标题</th>
                    <th>描述</th>
                    <th>截止日期</th>
                    <th>优先级</th>
                    <th>创建时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="tasksTableBody">
                <!-- 动态加载 -->
            </tbody>
        </table>
        <div id="loading">加载中...</div>
        <div id="noTasks" class="hidden">暂无任务</div>
    </div>

    <div class="pagination">
        <button id="prevBtn" disabled>上一页</button>
        <span id="pageInfo">第 1 页</span>
        <button id="nextBtn" disabled>下一页</button>
    </div>
</div>

<!-- 编辑任务模态框 -->
<div id="editModal" class="modal hidden">
    <div class="modal-content">
        <h3>编辑任务</h3>
        <form id="editTaskForm">
            <input type="hidden" id="editTaskId">
            <div class="form-group">
                <label for="editTitle">标题 *</label>
                <input type="text" id="editTitle" required maxlength="255">
            </div>
            <div class="form-group">
                <label for="editDescription">描述</label>
                <textarea id="editDescription" rows="4" maxlength="2000"></textarea>
            </div>
            <div class="form-group">
                <label for="editDeadline">截止日期</label>
                <input type="datetime-local" id="editDeadline">
            </div>
            <div class="form-group">
                <label for="editPriority">优先级 (1-5)</label>
                <select id="editPriority">
                    <option value="1">1 (最低)</option>
                    <option value="2">2</option>
                    <option value="3" selected>3</option>
                    <option value="4">4</option>
                    <option value="5">5 (最高)</option>
                </select>
            </div>
            <div class="form-actions">
                <button type="submit">保存</button>
                <button type="button" id="cancelEditBtn">取消</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/task_list.js') }}"></script>
{% endblock %}
